<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — JEEVIKA ERP</title>
  <meta name="description" content="Jeevika ERP Login — Society Accounting Management System">

  <!-- Bootstrap Icons (local-friendly CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* ── Reset ────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0D0D1A;
      color: #E0E0E0;
      overflow: hidden;
    }

    /* ── Animated Background ──────────────── */
    .login-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 0, 128, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 60, 160, 0.2) 0%, transparent 50%),
        linear-gradient(145deg, #0D0D1A 0%, #141428 50%, #0A0A1E 100%);
      animation: bgShift 15s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% {
        background-position: 0% 0%;
      }

      100% {
        background-position: 100% 100%;
      }
    }

    /* ── Grid Lines (subtle) ──────────────── */
    .login-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 0, 128, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 128, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Page Layout ──────────────────────── */
    .login-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Card ─────────────────────────────── */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(20, 20, 40, 0.85);
      border: 1px solid rgba(0, 0, 180, 0.3);
      border-radius: 10px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(0, 0, 128, 0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
      animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ── Card Header ──────────────────────── */
    .login-header {
      background: linear-gradient(135deg, #000080 0%, #0D47A1 50%, #1565C0 100%);
      padding: 28px 32px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    }

    .login-logo {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 24px;
      font-weight: 900;
      color: white;
    }

    .login-app-name {
      font-size: 22px;
      font-weight: 700;
      color: white;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .login-app-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.5px;
    }

    /* ── Card Body ────────────────────────── */
    .login-body {
      padding: 28px 32px;
    }

    /* ── Form ─────────────────────────────── */
    .login-form-group {
      margin-bottom: 18px;
    }

    .login-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: rgba(200, 210, 255, 0.8);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .login-input-icon {
      position: absolute;
      left: 12px;
      color: rgba(150, 165, 255, 0.6);
      font-size: 14px;
      pointer-events: none;
    }

    .login-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 0, 180, 0.35);
      border-radius: 5px;
      padding: 10px 12px 10px 36px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #E8EAF6;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .login-input:focus {
      border-color: rgba(63, 130, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(63, 130, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
    }

    .login-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .login-eye-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(150, 165, 255, 0.5);
      font-size: 14px;
      padding: 2px;
      transition: color 0.2s;
    }

    .login-eye-btn:hover {
      color: rgba(150, 165, 255, 0.9);
    }

    /* ── Submit Button ────────────────────── */
    .login-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #1565C0, #0D47A1);
      border: none;
      border-radius: 5px;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(13, 71, 161, 0.4);
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #1976D2, #1565C0);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(13, 71, 161, 0.5);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Error Message ────────────────────── */
    .login-error {
      display: none;
      background: rgba(192, 0, 0, 0.12);
      border: 1px solid rgba(192, 0, 0, 0.4);
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 12px;
      color: #FF8A80;
      margin-bottom: 16px;
      animation: shake 0.4s ease;
    }

    .login-error.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-6px);
      }

      40%,
      80% {
        transform: translateX(6px);
      }
    }

    /* ── Footer ───────────────────────────── */
    .login-footer {
      text-align: center;
      padding: 14px 32px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.3px;
    }

    /* ── Spinner inside button ────────────── */
    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="login-bg"></div>
  <div class="login-page">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">J</div>
        <div class="login-app-name">JEEVIKA ERP</div>
        <div class="login-app-sub">Society Accounting Management System</div>
      </div>

      <!-- Body -->
      <div class="login-body">

        <!-- Error -->
        <div class="login-error" id="loginError">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span id="loginErrorMsg"></span>
        </div>

        <!-- Form -->
        <form id="loginForm" autocomplete="off" novalidate>

          <div class="login-form-group">
            <label class="login-label" for="username">Username</label>
            <div class="login-input-wrap">
              <i class="bi bi-person-fill login-input-icon"></i>
              <input type="text" id="username" name="username" class="login-input" placeholder="Enter username"
                autocomplete="username" required>
            </div>
          </div>

          <div class="login-form-group">
            <label class="login-label" for="password">Password</label>
            <div class="login-input-wrap">
              <i class="bi bi-lock-fill login-input-icon"></i>
              <input type="password" id="password" name="password" class="login-input" placeholder="Enter password"
                autocomplete="current-password" required>
              <button type="button" class="login-eye-btn" id="togglePwd" title="Show/Hide Password">
                <i class="bi bi-eye-fill" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <div class="btn-spinner" id="btnSpinner"></div>
            <i class="bi bi-box-arrow-in-right" id="btnIcon"></i>
            <span id="btnText">Login</span>
          </button>

        </form>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        JEEVIKA ERP v2.0 &nbsp;|&nbsp; &copy; 2026 All Rights Reserved
      </div>

    </div>
  </div>

  <!-- Config must load first -->
  <script src="config.js"></script>
  <script>
    // ── Toggle Password Visibility ─────────────────────
    document.getElementById('togglePwd').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      const eye = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eye.className = 'bi bi-eye-slash-fill';
      } else {
        pwd.type = 'password';
        eye.className = 'bi bi-eye-fill';
      }
    });

    // ── Show Error ─────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('loginError');
      document.getElementById('loginErrorMsg').textContent = msg;
      el.classList.add('show');
    }

    function clearError() {
      document.getElementById('loginError').classList.remove('show');
    }

    // ── Button Loading State ───────────────────────────
    function setLoading(loading) {
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('btnSpinner');
      const icon = document.getElementById('btnIcon');
      const text = document.getElementById('btnText');

      btn.disabled = loading;
      spinner.style.display = loading ? 'block' : 'none';
      icon.style.display = loading ? 'none' : 'inline';
      text.textContent = loading ? 'Authenticating...' : 'Login';
    }

    // ── Login Form Submit ──────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        showError('Please enter both username and password.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(window.APP_CONFIG.API_BASE + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          // Store session
          sessionStorage.setItem('jwtToken', data.token);
          sessionStorage.setItem('userName', data.userName || username);
          sessionStorage.setItem('userType', data.userType || 'USER');
          sessionStorage.setItem('userLevel', data.userLevel || '1');
          sessionStorage.setItem('loginTime', Date.now().toString());

          // Clear any previous society/FY context
          sessionStorage.removeItem('activeSocietyId');
          sessionStorage.removeItem('activeFYId');

          // Redirect to setup page
          window.location.href = 'setup.html';
        } else {
          showError(data.message || 'Invalid username or password.');
          setLoading(false);
        }
      } catch (err) {
        if (err.name === 'TypeError') {
          showError('Cannot connect to server. Please make sure the backend is running.');
        } else {
          showError(err.message || 'Login failed. Please try again.');
        }
        setLoading(false);
      }
    });

    // ── Auto-focus username ────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      // If already logged in and context set, go to workspace
      const token = sessionStorage.getItem('jwtToken');
      const socId = sessionStorage.getItem('activeSocietyId');
      const fyId = sessionStorage.getItem('activeFYId');
      if (token && socId && fyId) {
        window.location.href = 'workspace.html';
        return;
      }
      document.getElementById('username').focus();
    });
  </script>
</body>

</html>
