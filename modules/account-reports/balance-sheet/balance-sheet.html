<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance Sheet — JEEVIKA ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="erp-module">
  <div class="erp-module-header">
    <div>
      <div class="erp-module-title">Balance Sheet Statement (Assets vs Liabilities)</div>
      
    </div>
    <div class="d-flex gap-6">
      <button class="erp-btn" onclick="window.print()"><i class="bi bi-printer"></i> Print Balance Sheet</button>
      <button class="erp-btn erp-btn-primary" onclick="loadBalanceSheet()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>
  </div>

  <div class="erp-module-body d-flex gap-12" style="padding:12px;">
    <!-- Liabilities Column -->
    <div class="erp-panel flex-1">
      <div class="erp-panel-title">LIABILITIES &amp; CAPITAL FUNDS</div>
      <table class="erp-table striped" id="liabTable">
        <thead><tr><th>Group / Account</th><th class="text-right">Amount (₹)</th></tr></thead>
        <tbody id="liabBody"></tbody>
        <tfoot>
          <tr style="background:var(--clr-face);font-weight:bold;">
            <td>Total Liabilities:</td>
            <td class="td-num text-danger" id="totLiab">0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Assets Column -->
    <div class="erp-panel flex-1">
      <div class="erp-panel-title">ASSETS &amp; PROPERTY</div>
      <table class="erp-table striped" id="assetTable">
        <thead><tr><th>Group / Account</th><th class="text-right">Amount (₹)</th></tr></thead>
        <tbody id="assetBody"></tbody>
        <tfoot>
          <tr style="background:var(--clr-face);font-weight:bold;">
            <td>Total Assets:</td>
            <td class="td-num text-success" id="totAssets">0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <script src="../../../assets/js/api.js"></script>
  <script src="../../../assets/js/auth.js"></script>
  <script src="../../../assets/js/utils.js"></script>
  <script src="balance-sheet.js"></script>
</body>
</html>
