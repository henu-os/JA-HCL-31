<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Register — JEEVIKA ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="erp-module">
  <div class="erp-module-header">
    <div>
      <div class="erp-module-title">Receipt Register (Complete Collections Log)</div>
      
    </div>
    <button class="erp-btn" onclick="window.print()"><i class="bi bi-printer"></i> Print Register</button>
  </div>

  <div class="erp-module-body" style="padding:0;">
    <div class="erp-table-container" style="height:100%;border:none;">
      <table class="erp-table striped" id="rrTable">
        <thead>
          <tr>
            <th style="width:40px;" class="td-center">#</th>
            <th style="width:100px;">Receipt No</th>
            <th style="width:90px;">Date</th>
            <th>Received Into Account</th>
            <th>Payer Particulars</th>
            <th class="text-right" style="width:120px;">Amount (₹)</th>
          </tr>
        </thead>
        <tbody id="rrBody"></tbody>
      </table>
    </div>
  </div>

  <script src="../../../assets/js/api.js"></script>
  <script src="../../../assets/js/auth.js"></script>
  <script src="../../../assets/js/utils.js"></script>
  <script src="receipt-register.js"></script>
</body>
</html>
