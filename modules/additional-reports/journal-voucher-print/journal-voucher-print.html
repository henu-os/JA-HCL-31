<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal Voucher Print — JEEVIKA ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="journal-voucher-print.css">
</head>
<body class="erp-module">

  <!-- ── Top Filter & Action Toolbar ───────────────────────────────────────── -->
  <div class="vp-toolbar no-print">
    <div class="vp-filter-group">
      <!-- Date Range -->
      <div class="vp-filter-item">
        <label for="fromDate"><i class="bi bi-calendar3"></i> From:</label>
        <input type="date" id="fromDate" class="vp-input" style="width:125px;" onchange="loadJournalVouchers()">
      </div>
      <div class="vp-filter-item">
        <label for="toDate">To:</label>
        <input type="date" id="toDate" class="vp-input" style="width:125px;" onchange="loadJournalVouchers()">
      </div>

      <!-- FY Date Presets -->
      <div class="vp-preset-btn-group">
        <button type="button" class="vp-preset-btn active" id="btnPresetFull" onclick="onPresetClick('full', this)">Full FY</button>
        <button type="button" class="vp-preset-btn" id="btnPresetThisMonth" onclick="onPresetClick('this-month', this)">This Month</button>
        <button type="button" class="vp-preset-btn" id="btnPresetLastMonth" onclick="onPresetClick('last-month', this)">Last Month</button>
        <button type="button" class="vp-preset-btn" id="btnPresetAll" onclick="onPresetClick('all', this)">All</button>
      </div>

      <!-- Ledger / Account Filter -->
      <div class="vp-filter-item">
        <label for="accountSelect"><i class="bi bi-journal-text"></i> Ledger Head:</label>
        <select id="accountSelect" class="vp-select" style="max-width:210px;" onchange="loadJournalVouchers()">
          <option value="all">All Ledgers / Heads</option>
        </select>
      </div>

      <!-- Voucher No Filter -->
      <div class="vp-filter-item">
        <label for="vouchNoFilter"><i class="bi bi-hash"></i> Voucher No:</label>
        <input type="text" id="vouchNoFilter" class="vp-input" style="width:110px;" placeholder="JV/..." onkeyup="onVoucherNoFilterKey(event)">
      </div>

      <!-- Live Search Box -->
      <div class="vp-search-box">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" placeholder="Search head, particulars, ref..." onkeyup="filterTable()">
      </div>
    </div>

    <!-- Action Buttons -->
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="vp-btn vp-btn-primary" onclick="loadJournalVouchers()" title="Refresh records from server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="vp-btn" onclick="resetFilters()" title="Reset all filters">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="vp-btn vp-btn-outline" onclick="previewSelectedVouchers()" id="btnPreviewSelected" title="Preview checked vouchers">
        <i class="bi bi-eye"></i> Preview (<span id="selCountPreview">0</span>)
      </button>
      <button class="vp-btn vp-btn-primary" onclick="printSelectedVouchers()" id="btnPrintSelected" title="Print checked vouchers in batch">
        <i class="bi bi-printer-fill"></i> Print Selected
      </button>
      <button class="vp-btn vp-btn-success" onclick="exportGridToExcel()" title="Export list to Excel .xlsx">
        <i class="bi bi-file-earmark-excel"></i> Export Excel
      </button>
    </div>
  </div>

  <!-- ── Scrollable Body Area ───────────────────────────────────────────────── -->
  <div class="vp-scroll-wrapper no-print">
    <div class="vp-card">

      <!-- Summary KPI Bar -->
      <div class="vp-summary-bar">
        <div class="vp-kpi-chips">
          <div class="vp-chip">
            <i class="bi bi-journal-check" style="color:#0f172a;"></i>
            <span>Journal Vouchers:</span>
            <span class="vp-chip-val" id="kpiTotalVouchers">0</span>
          </div>
          <div class="vp-chip">
            <i class="bi bi-arrow-down-up" style="color:#1d4ed8;"></i>
            <span>Total Debits:</span>
            <span class="vp-chip-val" id="kpiTotalDebit">₹ 0.00</span>
          </div>
          <div class="vp-chip">
            <i class="bi bi-arrow-down-up" style="color:#059669;"></i>
            <span>Total Credits:</span>
            <span class="vp-chip-val" id="kpiTotalCredit">₹ 0.00</span>
          </div>
          <div class="vp-chip" id="kpiDiffChip">
            <i class="bi bi-shield-check" style="color:#16a34a;"></i>
            <span id="kpiDiffText">Difference:</span>
            <span class="vp-chip-val" id="kpiDiffVal" style="color:#16a34a;">₹ 0.00</span>
          </div>
        </div>
        <div style="font-size:11px; font-weight:700; color:#475569;">
          <span id="selectedCountLabel">0 vouchers selected for printing</span>
        </div>
      </div>

      <!-- Results Grid Table -->
      <table class="vp-table" id="journalTable">
        <thead>
          <tr>
            <th style="width:36px;" class="td-center">
              <input type="checkbox" id="chkSelectAll" onchange="toggleSelectAll(this.checked)" title="Select/Deselect All">
            </th>
            <th style="width:40px;" class="td-center">#</th>
            <th style="width:130px;" class="td-center">Voucher No.</th>
            <th style="width:95px;" class="td-center">Date</th>
            <th>Main Particulars / Ledger Heads</th>
            <th style="width:120px;">Reference</th>
            <th class="td-amt" style="width:120px;">Total Debit (₹)</th>
            <th class="td-amt" style="width:120px;">Total Credit (₹)</th>
            <th style="width:100px;" class="td-center">Status</th>
            <th>Narration</th>
            <th style="width:145px;" class="td-center">Action</th>
          </tr>
        </thead>
        <tbody id="journalTableBody">
          <tr>
            <td colspan="11" class="td-center text-muted" style="padding:40px;">
              <i class="bi bi-arrow-repeat spin" style="font-size:20px;display:block;margin-bottom:8px;"></i>
              Loading Journal Vouchers...
            </td>
          </tr>
        </tbody>
        <tfoot>
          <tr style="background:#f8fafc; font-weight:800; border-top:2px solid var(--vp-border-clr);">
            <td colspan="6" class="td-right" style="text-transform:uppercase; padding-right:12px;">Total Journal Values:</td>
            <td class="td-amt" id="footTotDebit" style="color:#1d4ed8; font-size:12px;">₹ 0.00</td>
            <td class="td-amt" id="footTotCredit" style="color:#059669; font-size:12px;">₹ 0.00</td>
            <td colspan="3"></td>
          </tr>
        </tfoot>
      </table>

    </div>
  </div>

  <!-- ── Print-Only Target Zone ─────────────────────────────────────────────── -->
  <div id="voucherPrintArea" class="voucher-print-zone"></div>

  <!-- xlsx-js-style for Excel Export -->
  <script src="../../../assets/js/xlsx-js-style.bundle.js"></script>
  <script>
    if (typeof XLSX === 'undefined' || !XLSX.writeFile) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"><\/script>');
    }
  </script>
  <script src="../../../assets/js/api.js"></script>
  <script src="../../../assets/js/auth.js"></script>
  <script src="../../../assets/js/utils.js"></script>
  <script src="../voucher-print-common.js"></script>
  <script src="journal-voucher-print.js"></script>
</body>
</html>
