<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Deposite List — HENU ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="bank-deposit-list.css">
</head>
<body class="erp-module">

  <!-- Top Header Bar -->
  <header class="module-top-bar">
    <div class="module-title">
      <i class="bi bi-bank text-primary"></i>
      <span>Member Reports ➔ Bank Deposite List (Banking Pay-in Schedule)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" id="btnRefresh" title="Reload from Server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn-top" id="btnReset" title="Reset Filters">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="btn-top btn-top-primary" id="btnPrint" title="Print Schedule">
        <i class="bi bi-printer"></i> Print
      </button>
      <button class="btn-top btn-top-success" id="btnPdf" title="Export PDF">
        <i class="bi bi-file-earmark-pdf"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <div class="filter-group" style="width:140px;">
      <label class="filter-label">Bank Name:</label>
      <input type="text" class="filter-input" id="filterBankName" placeholder="All Banks">
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">Payment Mode:</label>
      <select class="filter-select" id="filterPaymentMode">
        <option value="">-- All Modes --</option>
        <option value="Cheque">Cheque</option>
        <option value="NEFT">NEFT / RTGS</option>
        <option value="UPI">UPI / Digital</option>
        <option value="Cash">Cash</option>
      </select>
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">From Date:</label>
      <input type="date" class="filter-input" id="filterDateFrom">
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">To Date:</label>
      <input type="date" class="filter-input" id="filterDateTo">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top btn-top-primary" id="btnApplyFilters">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>
  </div>

  <!-- KPI / Summary Strip -->
  <div class="kpi-summary-strip" id="kpiStrip" style="display:none;">
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Deposits:</span>
      <span class="kpi-val" id="kpiTotalDeposits">0</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Cheques:</span>
      <span class="kpi-val" id="kpiTotalCheques">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Electronic:</span>
      <span class="kpi-val" id="kpiTotalElectronic">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Grand Total:</span>
      <span class="kpi-val" id="kpiGrandTotal" style="color:var(--bd-primary);">₹0.00</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="report-viewport">
    <div id="bankDepositContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <!-- Dynamic Deposit List rendered here -->
    </div>
  </main>

  <script src="../henu-os-report-engine.js"></script>
  <script src="bank-deposit-list.js"></script>
</body>
</html>
