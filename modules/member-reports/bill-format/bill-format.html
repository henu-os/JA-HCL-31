<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Format — HENU ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="bill-format.css">
</head>
<body class="erp-module">

  <!-- Top Header Bar -->
  <header class="module-top-bar">
    <div class="module-title">
      <i class="bi bi-file-earmark-text text-primary"></i>
      <span>Member Reports ➔ Bill Format (A4 Tax Invoice / Bill of Supply)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" id="btnRefresh" title="Reload from Server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn-top" id="btnReset" title="Reset Filters">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="btn-top btn-top-primary" id="btnPrint" title="Print Current Document">
        <i class="bi bi-printer"></i> Print
      </button>
      <button class="btn-top btn-top-success" id="btnPdf" title="Export PDF">
        <i class="bi bi-file-earmark-pdf"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <div class="filter-group" style="width:140px;">
      <label class="filter-label">Bill Number:</label>
      <input type="text" class="filter-input" id="filterBillNo" placeholder="All Bills">
    </div>

    <div class="filter-group" style="width:100px;">
      <label class="filter-label">Wing / Block:</label>
      <input type="text" class="filter-input" id="filterWing" placeholder="All Wings">
    </div>

    <div class="filter-group" style="min-width:200px; flex:1; max-width:300px;">
      <label class="filter-label">Select Member:</label>
      <select class="filter-select" id="filterMember">
        <option value="">-- All Members --</option>
      </select>
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">From Date:</label>
      <input type="date" class="filter-input" id="filterBillFrom">
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">To Date:</label>
      <input type="date" class="filter-input" id="filterBillTo">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top btn-top-primary" id="btnApplyFilters">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>
  </div>

  <!-- KPI / Summary Strip -->
  <div class="kpi-summary-strip" id="kpiStrip" style="display:none;">
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Bills:</span>
      <span class="kpi-val" id="kpiTotalBills">0</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Taxable:</span>
      <span class="kpi-val" id="kpiTotalTaxable">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Tax:</span>
      <span class="kpi-val" id="kpiTotalTax">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Net Payable:</span>
      <span class="kpi-val" id="kpiNetPayable" style="color:var(--erp-primary);">₹0.00</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="report-viewport">
    <div id="billContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <!-- Dynamic Bill Document rendered here -->
    </div>
  </main>

  <script src="../henu-os-report-engine.js"></script>
  <script src="bill-format.js"></script>
</body>
</html>
