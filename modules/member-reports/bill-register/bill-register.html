<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Register — HENU ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="bill-register.css">
</head>
<body class="erp-module">

  <!-- Top Header Bar -->
  <header class="module-top-bar">
    <div class="module-title">
      <i class="bi bi-receipt-cutoff text-primary"></i>
      <span>Member Reports ➔ Bill Register (Comprehensive Charge Breakdown)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" id="btnRefresh" title="Reload from Server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn-top" id="btnReset" title="Reset Filters">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="btn-top btn-top-primary" id="btnPrint" title="Print Register">
        <i class="bi bi-printer"></i> Print
      </button>
      <button class="btn-top btn-top-success" id="btnPdf" title="Export PDF">
        <i class="bi bi-file-earmark-pdf"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <div class="filter-group" style="width:110px;">
      <label class="filter-label">Wing:</label>
      <input type="text" class="filter-input" id="filterWing" placeholder="All Wings">
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">From Date:</label>
      <input type="date" class="filter-input" id="filterDateFrom">
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">To Date:</label>
      <input type="date" class="filter-input" id="filterDateTo">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top btn-top-primary" id="btnApplyFilters">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>
  </div>

  <!-- KPI / Summary Strip -->
  <div class="kpi-summary-strip" id="kpiStrip" style="display:none;">
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Bills:</span>
      <span class="kpi-val" id="kpiTotalBills">0</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Maintenance:</span>
      <span class="kpi-val" id="kpiTotalMaint">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Sinking Fund:</span>
      <span class="kpi-val" id="kpiTotalSinking">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Grand Total Billed:</span>
      <span class="kpi-val" id="kpiGrandTotal" style="color:var(--br-primary);">₹0.00</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="report-viewport">
    <div id="billRegisterContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <!-- Dynamic Bill Register rendered here -->
    </div>
  </main>

  <script src="../henu-os-report-engine.js"></script>
  <script src="bill-register.js"></script>
</body>
</html>
