<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATA SHEET — HENU ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="data-sheet.css">
</head>
<body class="erp-module">

  <!-- Top Header Bar -->
  <header class="module-top-bar">
    <div class="module-title">
      <i class="bi bi-layout-text-window text-primary"></i>
      <span>Member Reports ➔ DATA SHEET (Comprehensive Member Master Directory)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" id="btnRefresh" title="Reload from Server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn-top" id="btnReset" title="Reset Filters">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="btn-top btn-top-primary" id="btnPrint" title="Print Data Sheet">
        <i class="bi bi-printer"></i> Print
      </button>
      <button class="btn-top btn-top-success" id="btnPdf" title="Export PDF">
        <i class="bi bi-file-earmark-pdf"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <div class="filter-group" style="width:120px;">
      <label class="filter-label">Wing:</label>
      <input type="text" class="filter-input" id="filterWing" placeholder="All Wings">
    </div>

    <div class="filter-group" style="width:140px;">
      <label class="filter-label">Flat Type / BHK:</label>
      <input type="text" class="filter-input" id="filterFlatType" placeholder="All Types">
    </div>

    <div class="filter-group" style="min-width:200px; flex:1; max-width:320px;">
      <label class="filter-label">Search Member / Flat / Phone:</label>
      <input type="text" class="filter-input" id="filterSearch" placeholder="Type to search...">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top btn-top-primary" id="btnApplyFilters">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>
  </div>

  <!-- KPI / Summary Strip -->
  <div class="kpi-summary-strip" id="kpiStrip" style="display:none;">
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Members:</span>
      <span class="kpi-val" id="kpiTotalMembers">0</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Carpet Area:</span>
      <span class="kpi-val" id="kpiTotalArea">0 Sq.Ft</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Opening Debtors:</span>
      <span class="kpi-val" id="kpiTotalOpening" style="color:var(--ds-primary);">₹0.00</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="report-viewport">
    <div id="dataSheetContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <!-- Dynamic Data Sheet rendered here -->
    </div>
  </main>

  <script src="../henu-os-report-engine.js"></script>
  <script src="data-sheet.js"></script>
</body>
</html>
