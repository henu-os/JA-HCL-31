<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Control Account — HENU ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="member-control-account.css">
</head>
<body class="erp-module">

  <!-- Top Header Bar -->
  <header class="module-top-bar">
    <div class="module-title">
      <i class="bi bi-shield-check text-primary"></i>
      <span>Member Reports ➔ Member Control Account (Monthly Demand & Collection Reconciliation)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" id="btnRefresh" title="Reload from Server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn-top" id="btnReset" title="Reset Filters">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="btn-top btn-top-primary" id="btnPrint" title="Print Control Account">
        <i class="bi bi-printer"></i> Print
      </button>
      <button class="btn-top btn-top-success" id="btnPdf" title="Export PDF">
        <i class="bi bi-file-earmark-pdf"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <div class="filter-group" style="width:130px;">
      <label class="filter-label">From Date:</label>
      <input type="date" class="filter-input" id="filterDateFrom">
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">To Date:</label>
      <input type="date" class="filter-input" id="filterDateTo">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top btn-top-primary" id="btnApplyFilters">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>
  </div>

  <!-- KPI / Summary Strip -->
  <div class="kpi-summary-strip" id="kpiStrip" style="display:none;">
    <div class="kpi-pill">
      <span class="kpi-lbl">Opening Debtors:</span>
      <span class="kpi-val" id="kpiOpening">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Demand Raised:</span>
      <span class="kpi-val" id="kpiDemand">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Collections:</span>
      <span class="kpi-val" id="kpiCollections" style="color:var(--erp-success);">₹0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Closing Receivable:</span>
      <span class="kpi-val" id="kpiClosing" style="color:var(--ctrl-primary);">₹0.00</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="report-viewport">
    <div id="controlAccountContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <!-- Dynamic Control Account rendered here -->
    </div>
  </main>

  <script src="../henu-os-report-engine.js"></script>
  <script src="member-control-account.js"></script>
</body>
</html>
