<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member JV Register — JEEVIKA ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../member-reports-grid.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="member-jv-register.css">
</head>
<body class="erp-module">

  <!-- TOP ACTION BAR (Mail to Committee standard) -->
  <div class="module-top-bar no-print">
    <div class="module-title">
      <i class="bi bi-journal-bookmark" style="color:var(--jv-primary, #1e3a8a);"></i>
      <span>Member Journal Voucher (JV) Register</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" onclick="printReport()"><i class="bi bi-printer"></i> Print</button>
      <button class="btn-top" onclick="exportPdf()"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
      <button class="btn-top primary" onclick="loadJVRegister()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      <button class="btn-top" onclick="resetFilters()"><i class="bi bi-x-circle"></i> Reset</button>
    </div>
  </div>

  <!-- FILTER STRIP -->
  <div class="filter-strip no-print">
    <div class="filter-group">
      <label class="filter-label">From Date</label>
      <input type="date" id="fromDate" class="filter-control">
    </div>

    <div class="filter-group">
      <label class="filter-label">To Date</label>
      <input type="date" id="toDate" class="filter-control">
    </div>

    <div class="filter-group" style="width:100px;">
      <label class="filter-label">Wing</label>
      <input type="text" id="wing" class="filter-control" placeholder="All">
    </div>

    <div class="filter-group" style="flex:1; min-width:180px;">
      <label class="filter-label">Member Search</label>
      <input type="text" id="fromMember" class="filter-control" placeholder="Search member name...">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top primary" onclick="loadJVRegister()"><i class="bi bi-funnel"></i> Apply Filter</button>
    </div>
  </div>

  <!-- KPI SUMMARY STRIP -->
  <div class="kpi-summary-strip no-print">
    <div class="kpi-pill">
      <span class="kpi-pill-label">Total JVs:</span>
      <span class="kpi-pill-value" id="kpiTotalJvs">0</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-pill-label">Total Debit:</span>
      <span class="kpi-pill-value" id="kpiTotalDebit">₹ 0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-pill-label">Total Credit:</span>
      <span class="kpi-pill-value" id="kpiTotalCredit">₹ 0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-pill-label">Variance:</span>
      <span class="kpi-pill-value" id="kpiVariance">₹ 0.00</span>
    </div>
    <div class="kpi-pill" id="kpiStatusPill">
      <span class="kpi-pill-label">Status:</span>
      <span class="kpi-pill-value" id="kpiStatus">MATCHED</span>
    </div>
  </div>

  <!-- MAIN REPORT CONTAINER -->
  <div class="jv-module-wrapper report-document-viewport" id="jvContainer">
    <!-- Rendered dynamically from live ERP data -->
  </div>

  <script src="../henu-os-report-engine.js"></script>
  <script src="member-jv-register.js"></script>
</body>
</html>
