<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Outstanding / Balance Report — JEEVIKA ERP</title>

  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="outstanding.css">
</head>
<body class="erp-module" style="margin: 0; padding: 0; overflow: hidden;">

  <div class="bill-format-workspace">
    <!-- LEFT PANEL: Filter & Parameters -->
    <aside class="bill-filter-sidebar">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
        <h3 style="font-size: 13px; font-weight: 700; margin: 0; color: #1e293b;">
          <i class="bi bi-filter-circle"></i> Outstanding Criteria
        </h3>
        <button type="button" id="btn-reset" class="btn btn-sm btn-outline-secondary" style="font-size: 11px; padding: 2px 8px; height: 26px;">
          <i class="bi bi-arrow-counterclockwise"></i> Reset
        </button>
      </div>

      <!-- Member Range -->
      <div class="filter-grid-2">
        <div class="filter-group">
          <label>From Member</label>
          <select id="fromMember"></select>
        </div>
        <div class="filter-group">
          <label>To Member</label>
          <select id="toMember"></select>
        </div>
      </div>

      <!-- Period Range Radio & Date Picker -->
      <div class="filter-group">
        <label>Period Range</label>
        <div style="display: flex; gap: 14px; margin-bottom: 6px; font-size: 12px;">
          <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
            <input type="radio" name="periodMode" value="opening" /> Opening
          </label>
          <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
            <input type="radio" name="periodMode" value="asOn" checked /> As On
          </label>
        </div>
        <input type="date" id="asOnDate" />
      </div>

      <!-- Amount Range -->
      <div class="filter-grid-2">
        <div class="filter-group">
          <label>From Amount</label>
          <input type="number" id="minAmount" value="-999999999" />
        </div>
        <div class="filter-group">
          <label>To Amount</label>
          <input type="number" id="maxAmount" value="999999999" />
        </div>
      </div>

      <!-- Toggles -->
      <div class="filter-grid-2">
        <div class="filter-group">
          <label>Show Zero Balance</label>
          <select id="showZeroBalance">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Show Bldg/Wing</label>
          <select id="showBldgWing">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Show Contact</label>
          <select id="showContact">
            <option value="NO">NO</option>
            <option value="YES">YES</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Report Type</label>
          <select id="reportType">
            <option value="Summary">Summary</option>
            <option value="Detailed">Detailed</option>
          </select>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="sidebar-actions">
        <button type="button" id="btn-show-grid" class="btn btn-primary" style="flex: 1; height: 36px; font-size: 12px; font-weight: 600;">
          <i class="bi bi-table"></i> Show Report
        </button>
        <button type="button" id="btn-preview-cr" class="btn btn-dark" style="flex: 1; height: 36px; font-size: 12px; font-weight: 600;">
          <i class="bi bi-file-earmark-pdf"></i> Preview
        </button>
        <button type="button" id="btn-print" class="btn btn-success" style="height: 36px; padding: 0 12px;" title="Print Report">
          <i class="bi bi-printer"></i>
        </button>
      </div>
    </aside>

    <!-- RIGHT PANEL: Dual View Workspace (Grid View & Crystal Report Print Preview) -->
    <main class="bill-preview-workspace" id="preview-viewport">
      <!-- View Mode Switch Tabs -->
      <div class="mode-tabs no-print" style="width: 100%; display: flex; gap: 8px; margin-bottom: 12px;">
        <button type="button" id="tab-grid" class="tab-btn active"><i class="bi bi-grid-3x3"></i> Data Grid Ledger</button>
        <button type="button" id="tab-report" class="tab-btn"><i class="bi bi-file-earmark-text"></i> Crystal Report (A4)</button>
      </div>

      <!-- CONTAINER 1: Interactive DataGrid View -->
      <div id="grid-view-container" style="width: 100%; height: calc(100% - 44px); display: flex; flex-direction: column; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
        <div style="padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
          <div style="font-weight: 700; font-size: 13px; color: #1e293b;" id="grid-header-title">Member Balance Ledger</div>
          <div style="width: 250px;">
            <input type="text" id="gridSearchInput" placeholder="Quick search member, code, flat..." style="width: 100%; height: 28px; font-size: 11px; padding: 2px 8px; border: 1px solid #cbd5e1; border-radius: 4px;" />
          </div>
        </div>
        <div style="flex: 1; overflow: auto;">
          <table class="grid-table" id="outstandingGridTable">
            <thead>
              <tr id="gridTheadRow">
                <th style="width: 90px;">Code</th>
                <th>Name</th>
                <th style="width: 110px; text-align: right;">Principal</th>
                <th style="width: 90px; text-align: right;">Interest</th>
                <th style="width: 120px; text-align: right;">Debit</th>
                <th style="width: 120px; text-align: right;">Credit</th>
              </tr>
            </thead>
            <tbody id="outstandingGridBody">
              <tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 40px;">Click "Show Report" to calculate ledger balances.</td></tr>
            </tbody>
            <tfoot id="outstandingGridFoot" style="display: none; background: #f1f5f9; font-weight: bold;">
              <tr>
                <td id="footLabelCell" colspan="4" style="text-align: right;">Total:</td>
                <td style="text-align: right;" id="footTotalDebit">0.00</td>
                <td style="text-align: right;" id="footTotalCredit">0.00</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <!-- CONTAINER 2: Crystal Report A4 Multi-Page Container -->
      <div id="report-view-container" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        <div id="preview-render-area" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <div style="color: #94a3b8; text-align: center; margin-top: 100px;">
            <i class="bi bi-file-earmark-text" style="font-size: 48px; display: block; margin-bottom: 10px;"></i>
            <div style="font-size: 14px; font-weight: 600; color: #cbd5e1;">Crystal Report Preview</div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Click "Preview" or "Show Report" to generate the A4 report.</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../../config.js"></script>
  <script src="../../../assets/js/api.js"></script>
  <script src="../../../assets/js/auth.js"></script>
  <script src="../../../assets/js/utils.js"></script>
  <script src="outstanding.js"></script>
</body>
</html>
