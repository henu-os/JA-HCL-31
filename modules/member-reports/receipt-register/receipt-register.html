<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Receipt Register — JEEVIKA ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../member-reports-grid.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="receipt-register.css">
</head>
<body class="erp-module">

  <!-- TOP ACTION BAR (Mail to Committee standard) -->
  <div class="module-top-bar no-print">
    <div class="module-title">
      <i class="bi bi-cash-coin" style="color:var(--rr-accent, #059669);"></i>
      <span>Member Receipt Register (Collections Register)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" onclick="printReport()"><i class="bi bi-printer"></i> Print</button>
      <button class="btn-top" onclick="exportPdf()"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
      <button class="btn-top primary" onclick="loadReceiptRegister()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      <button class="btn-top" onclick="resetFilters()"><i class="bi bi-x-circle"></i> Reset</button>
    </div>
  </div>

  <!-- FILTER STRIP -->
  <div class="filter-strip no-print">
    <div class="filter-group">
      <label class="filter-label">From Date</label>
      <input type="date" id="filterFromDate" class="filter-control">
    </div>

    <div class="filter-group">
      <label class="filter-label">To Date</label>
      <input type="date" id="filterToDate" class="filter-control">
    </div>

    <div class="filter-group">
      <label class="filter-label">Payment Mode</label>
      <select id="filterMode" class="filter-control" onchange="loadReceiptRegister()">
        <option value="all" selected>All Modes</option>
        <option value="Cheque">Cheque</option>
        <option value="NEFT">NEFT / Digital / UPI</option>
        <option value="Cash">Cash</option>
      </select>
    </div>

    <div class="filter-group" style="flex:1; min-width:180px;">
      <label class="filter-label">Member Search</label>
      <input type="text" id="filterMember" class="filter-control" placeholder="Search by name or flat...">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top primary" onclick="loadReceiptRegister()"><i class="bi bi-funnel"></i> Apply Filter</button>
    </div>
  </div>

  <!-- KPI SUMMARY STRIP -->
  <div class="kpi-summary-strip no-print">
    <div class="kpi-pill">
      <span class="kpi-pill-label">Receipts Count:</span>
      <span class="kpi-pill-value" id="kpiReceiptCount">0</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-pill-label">Cash:</span>
      <span class="kpi-pill-value" id="kpiCash">₹ 0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-pill-label">Cheque:</span>
      <span class="kpi-pill-value" id="kpiCheque">₹ 0.00</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-pill-label">Digital / UPI:</span>
      <span class="kpi-pill-value" id="kpiDigital">₹ 0.00</span>
    </div>
    <div class="kpi-pill primary">
      <span class="kpi-pill-label">Total Collections:</span>
      <span class="kpi-pill-value" id="kpiTotalCollections">₹ 0.00</span>
    </div>
  </div>

  <!-- MAIN DOCUMENT CONTAINER -->
  <div class="rr-module-wrapper report-document-viewport" id="rrContainer">
    <!-- Rendered dynamically from live ERP data -->
  </div>

  <script src="../henu-os-report-engine.js"></script>
  <script src="receipt-register.js"></script>
</body>
</html>
