<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt — HENU ERP</title>
  <script src="../../../config.js"></script>
  <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../henu-os-report-engine.css">
  <link rel="stylesheet" href="receipt.css">
</head>
<body class="erp-module">

  <!-- Top Header Bar -->
  <header class="module-top-bar">
    <div class="module-title">
      <i class="bi bi-receipt text-primary"></i>
      <span>Member Reports ➔ Receipt (A4 2-Up Official Voucher)</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" id="btnRefresh" title="Reload from Server">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
      <button class="btn-top" id="btnReset" title="Reset Filters">
        <i class="bi bi-x-circle"></i> Reset
      </button>
      <button class="btn-top btn-top-primary" id="btnPrint" title="Print Receipts">
        <i class="bi bi-printer"></i> Print
      </button>
      <button class="btn-top btn-top-success" id="btnPdf" title="Export PDF">
        <i class="bi bi-file-earmark-pdf"></i> Export PDF
      </button>
    </div>
  </header>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <div class="filter-group" style="width:140px;">
      <label class="filter-label">Receipt Number:</label>
      <input type="text" class="filter-input" id="filterReceiptNo" placeholder="All Receipts">
    </div>

    <div class="filter-group" style="min-width:200px; flex:1; max-width:300px;">
      <label class="filter-label">Select Member:</label>
      <select class="filter-select" id="filterMember">
        <option value="">-- All Members --</option>
      </select>
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">Payment Mode:</label>
      <select class="filter-select" id="filterPaymentMode">
        <option value="">-- All Modes --</option>
        <option value="Cheque">Cheque</option>
        <option value="NEFT">NEFT / RTGS</option>
        <option value="UPI">UPI / Digital</option>
        <option value="Cash">Cash</option>
      </select>
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">From Date:</label>
      <input type="date" class="filter-input" id="filterDateFrom">
    </div>

    <div class="filter-group" style="width:130px;">
      <label class="filter-label">To Date:</label>
      <input type="date" class="filter-input" id="filterDateTo">
    </div>

    <div class="filter-group" style="align-self:flex-end;">
      <button class="btn-top btn-top-primary" id="btnApplyFilters">
        <i class="bi bi-funnel"></i> Apply
      </button>
    </div>
  </div>

  <!-- KPI / Summary Strip -->
  <div class="kpi-summary-strip" id="kpiStrip" style="display:none;">
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Receipts:</span>
      <span class="kpi-val" id="kpiTotalReceipts">0</span>
    </div>
    <div class="kpi-pill">
      <span class="kpi-lbl">Total Amount Received:</span>
      <span class="kpi-val" id="kpiTotalAmount" style="color:var(--erp-primary);">₹0.00</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="report-viewport">
    <div id="receiptContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <!-- Dynamic Receipts rendered here -->
    </div>
  </main>

  <script src="../henu-os-report-engine.js"></script>
  <script src="receipt.js"></script>
</body>
</html>
