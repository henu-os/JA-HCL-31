<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Financial Year — JEEVIKA ERP</title>
  <script src="../../../config.js"></script>
  <script src="../../../assets/js/utils.js"></script>
  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="select-year.css">
</head>
<body class="erp-module">

  <!-- ── Top Module Bar ───────────────────────────────────────── -->
  <div class="module-top-bar">
    <div>
      <div class="module-title">
        <i class="bi bi-calendar-range"></i> Active Financial Year Selector
      </div>
      <div class="module-subtitle">
        <i class="bi bi-arrow-repeat text-primary"></i> Switch the global accounting financial year context across all ERP voucher, ledger, and report modules
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn-top" onclick="loadYears()">
        <i class="bi bi-arrow-counterclockwise"></i> Refresh
      </button>
    </div>
  </div>

  <!-- ── Summary Stats Ribbon ─────────────────────────────────── -->
  <div class="summary-strip">
    <div class="summary-stats">
      <div class="stat-item">
        <span>Active Operating Year:</span> <span id="metricActiveYear" class="stat-val-highlight">—</span>
      </div>
      <div class="stat-item">
        <span>Configured Years:</span> <span id="metricTotalYears" class="stat-val-highlight">0</span>
      </div>
    </div>
    <div class="summary-count" id="recordCount">
      Ready
    </div>
  </div>

  <!-- ── Main Content Area / Table ─────────────────────────────── -->
  <div class="module-content">
    <div class="table-container">
      <table class="erp-data-table" id="yearTable">
        <thead>
          <tr>
            <th style="width:45px;" class="td-center">#</th>
            <th style="width:160px;">Financial Year</th>
            <th style="width:140px;">Start Date</th>
            <th style="width:140px;">End Date</th>
            <th style="width:130px;" class="td-center">Status</th>
            <th style="width:160px;" class="td-center">Action</th>
          </tr>
        </thead>
        <tbody id="yearTableBody">
          <tr>
            <td colspan="6" class="empty-state">
              <div class="erp-spinner"></div> Loading financial years...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="select-year.js"></script>
</body>
</html>
